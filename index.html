<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Расписание">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <title>Расписание БГМУ</title>
</head>
<body>
  <main class="app">
    <header class="header">
      <div>
        <h1>Расписание</h1>
        <div id="group" class="group"></div>
      </div>
      <div id="todayBadge" class="today-badge">Сегодня</div>
    </header>

    <section class="date-navigation" aria-label="Навигация по дням">
      <button id="previousDay" class="nav-button" aria-label="Предыдущий день">‹</button>
      <button id="dateButton" class="date-center" aria-label="Вернуться к сегодняшнему дню">
        <div id="dayName"></div>
        <div id="date"></div>
      </button>
      <button id="nextDay" class="nav-button" aria-label="Следующий день">›</button>
    </section>

    <button id="todayButton" class="today-button">Сегодня</button>

    <section id="schedule" class="schedule" aria-live="polite"></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
